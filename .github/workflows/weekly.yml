name: Weekly archive

on:
  schedule:
    # Cron is UTC only. 04:23 UTC Tuesday = Monday 20:23 PST / 21:23 PDT:
    # after the coach's Monday feedback, before the grid is overwritten.
    # The runner's date is then Tuesday, so week_ending_for() files the run
    # under the Monday just finished. Scheduled runs can start hours late,
    # worst on the hour, hence the odd minute and the early-evening slot.
    - cron: "23 4 * * 2"
  workflow_dispatch: # "Run workflow" button for manual runs

permissions:
  contents: write # commit the updated data/ back to the repo

concurrency:
  group: weekly-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Write service-account key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$SERVICE_ACCOUNT_JSON" > credentials/service-account.json

      - name: Pull the sheet
        run: python tracker.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Archive weekly stats ($(date -u +%F))"
            git push
          fi
